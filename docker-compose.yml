name: proveedores

services:
  postgres-dev:
    image: postgres:16
    container_name: proveedores-pg-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proveedores_dev
    ports:
      - "54329:5432"
    volumes:
      - pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proveedores_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-prod:
    image: postgres:16
    container_name: proveedores-pg-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proveedores_prod
    ports:
      - "54330:5432"
    volumes:
      - pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d proveedores_prod"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pg_dev:
  pg_prod:
