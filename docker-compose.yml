services:
  postgres:
    image: postgres:16
    container_name: proveedores-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proveedores_dev
    ports:
      - "54329:5432"
    volumes:
      - proveedores_pg:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/02-databases.sql

volumes:
  proveedores_pg:
